<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HoneyBee Store</title><link rel="stylesheet" href="css/honeybee.css"><link rel="manifest" href="manifest.json"></head><body>
<header class="hb-header"><div class="hb-shell hb-header-inner"><div class="hb-brand"><span class="hb-logo">🏪</span><span>Store Dashboard<small>Nhận hàng, từ chối/trả hàng và cập nhật POS</small></span></div><a class="hb-btn ghost" href="login.html">Đăng xuất</a></div></header>
<main class="hb-shell" style="padding:22px 0"><section class="hb-grid"><article class="hb-card hb-col-7"><h2>Lô hàng giao đến Store</h2><p class="hb-note">Store thấy các lô đã được Transport giao, sau đó xác nhận nhận hàng hoặc từ chối nếu có sự cố.</p><button class="hb-btn ghost" id="refresh-btn">↻ Tải lại</button><div id="store-list" style="margin-top:14px"></div></article><article class="hb-card hb-col-5"><h2>Cập nhật trạng thái bán theo QR</h2><form id="sale-form" class="hb-form"><label>QR token<input name="qrToken" required placeholder="HB-QR-RAU-001-SAFE"></label><input type="hidden" name="storeId"><input type="hidden" name="userId"><label>Trạng thái bán<select name="saleStatus"><option value="SOLD">Đã bán</option><option value="NOT_SOLD">Chưa bán / mở lại</option><option value="RETURNED">Hoàn trả</option></select></label><label>Ghi chú<textarea name="note"></textarea></label><button class="hb-btn full" type="submit">💾 Lưu trạng thái QR</button><p id="sale-message"></p></form></article></section></main>
<script src="js/api.js"></script><script src="js/store.js"></script><script src="js/pwa.js"></script></body></html>
