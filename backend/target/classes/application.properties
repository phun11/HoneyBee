# ============================================================
# HoneyBee Trace - Oracle version
# ============================================================
server.port=8080
server.address=0.0.0.0
spring.application.name=honeybee-trace-oracle

# Oracle local connection.
# Nếu máy bạn dùng XEPDB1 thì đổi FREEPDB1 thành XEPDB1.
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=HONEYBEE_WEB
spring.datasource.password=12345

# Oracle schema chạy thủ công trong SQL Developer, nên không auto init khi start app.
spring.sql.init.mode=never

app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:8080}
app.qr.secret=HoneyBee-Trace-Demo-Secret-2026

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.h2.console.enabled=false
